<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="color-scheme" content="dark" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
        />
        <title>{{ title }}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap"
            media="print"
            onload="this.media = 'all'"
        />
        <link rel="stylesheet" href="theme.css" />
        <link rel="stylesheet" href="layout.css" />
        <link rel="stylesheet" href="app.css" />
        <link rel="stylesheet" href="uPlot.min.css" />
        <script>
            var CFG = {{ config_json | safe }};
        </script>
    </head>
    <body>
        <div class="layout">
            <header class="header">
                <div class="logo-btn">
                    <span class="header-title-icon">
                        <svg
                            class="logo-svg"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <g class="logo-sun">
                                <path d="M12 2v2" />
                                <path d="m4.93 4.93 1.41 1.41" />
                                <path d="M20 12h2" />
                                <path d="m19.07 4.93-1.41 1.41" />
                                <path d="M15.947 12.65a4 4 0 0 0-5.925-4.128" />
                            </g>
                            <path
                                class="logo-cloud"
                                d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"
                            />
                        </svg>
                    </span>
                    <span class="header-title-text" id="appTitle"
                        >{{ title }}</span
                    >
                </div>
                <button
                    class="cycle-btn gear-btn"
                    id="menuToggle"
                    type="button"
                    aria-haspopup="true"
                    aria-expanded="false"
                    aria-label="Display settings"
                    title="Display settings"
                >
                    <svg
                        class="gear-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path
                            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
                        />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
                <div
                    class="settings-panel"
                    id="settingsPanel"
                    role="menu"
                    aria-label="Display settings"
                >
                    <div class="setting-row">
                        <span class="setting-label">Temp</span>
                        <div class="seg" id="tempSeg" data-values="°F,°C"></div>
                    </div>
                    <div class="setting-row">
                        <span class="setting-label">Speed</span>
                        <div
                            class="seg"
                            id="speedSeg"
                            data-values="mph,kph,kn"
                        ></div>
                    </div>
                    <div class="setting-row">
                        <span class="setting-label">Range</span>
                        <div
                            class="seg"
                            id="rangeSeg"
                            data-values="15m,30m,1h,2h,4h,8h"
                        ></div>
                    </div>
                </div>
            </header>

            <div class="grid-container">
                <div class="grid" id="grid">
                    <div id="c1" class="col aspect-square">
                        {% for station in stations %}
                        <div
                            class="cell station-cell"
                            id="station-{{ station.id }}"
                            data-station="{{ station.id }}"
                        >
                            <div class="station-header">
                                <span
                                    class="station-status live"
                                    id="status-{{ station.id }}"
                                ></span>
                                <span class="station-name"
                                    >{{ station.label }}</span
                                >
                            </div>
                            <div class="station-body">
                                <div
                                    class="station-metrics"
                                    id="metrics-{{ station.id }}"
                                ></div>
                                <div
                                    class="rose-wrap"
                                    id="rose-{{ station.id }}"
                                ></div>
                            </div>
                        </div>
                        {% endfor %}
                        <footer class="footer">
                            <span class="footer-legend" id="legend">
                                {% for bucket in speed_buckets %}
                                <span class="legend-item">
                                    <span
                                        class="legend-swatch s{{ bucket.index + 1 }}"
                                    ></span>
                                    <span class="legend-label"
                                        >{{ bucket.label }}</span
                                    >
                                </span>
                                {% endfor %}
                            </span>
                        </footer>
                    </div>
                    <div id="c2" class="col">
                        {% for station in stations %}
                        <div class="cell chart-cell">
                            <div
                                class="chart-wrap"
                                id="speedChart-{{ station.id }}"
                            ></div>
                            <div
                                class="chart-wrap"
                                id="dirChart-{{ station.id }}"
                            ></div>
                        </div>
                        {% endfor %}
                        <footer class="footer">
                            <div class="time-axis" id="timeAxis"></div>
                        </footer>
                    </div>
                </div>
            </div>
        </div>

        <div class="tooltip" id="tooltip"></div>

        <script src="uPlot.min.js"></script>
        <script src="app.js"></script>
    </body>
</html>
